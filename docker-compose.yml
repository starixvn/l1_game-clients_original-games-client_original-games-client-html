services:
    sedie-multiplayer:
        build:
            context: .
            dockerfile: packages/sedie-multiplayer/Dockerfile
        container_name: sedie-game-container
        ports:
            - "5000:5000"
        environment:
            - NODE_ENV=production
            - PORT=5000
        restart: unless-stopped
        networks:
            - game-network

    baccarat-multiplayer:
        build:
            context: .
            dockerfile: packages/baccarat-multiplayer/Dockerfile
        container_name: baccarat-game-container
        ports:
            - "5001:5001"
        environment:
            - NODE_ENV=production
            - PORT=5001
        restart: unless-stopped
        networks:
            - game-network

    reverse-proxy:
        image: node:18-alpine
        container_name: games-proxy-container
        working_dir: /app
        ports:
            - "3000:3000"
        volumes:
            - .:/app
        command: node reverse-proxy.js
        environment:
            - PROXY_PORT=3000
        depends_on:
            - sedie-multiplayer
            - baccarat-multiplayer
        restart: unless-stopped
        networks:
            - game-network

networks:
    game-network:
        driver: bridge
